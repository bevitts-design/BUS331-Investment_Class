<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">BUS331 Mission Control market chart app icon</title>
  <description id="description">A professional gold rising market line over high-contrast candlesticks on a navy and teal rounded square.</description>
  <defs>
    <linearGradient id="background" x1="130" y1="100" x2="895" y2="930" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A2540"/>
      <stop offset="0.58" stop-color="#123C55"/>
      <stop offset="1" stop-color="#1B6F73"/>
    </linearGradient>
    <linearGradient id="gold" x1="235" y1="725" x2="815" y2="285" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B8843D"/>
      <stop offset="0.55" stop-color="#D4A052"/>
      <stop offset="1" stop-color="#FFD889"/>
    </linearGradient>
    <linearGradient id="shine" x1="214" y1="112" x2="705" y2="702" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.035"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#001827" flood-opacity="0.34"/>
    </filter>
    <filter id="markShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#001A25" flood-opacity="0.42"/>
    </filter>
    <clipPath id="tileClip">
      <rect x="64" y="64" width="896" height="896" rx="208"/>
    </clipPath>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#background)" filter="url(#tileShadow)"/>
  <g clip-path="url(#tileClip)">
    <path d="M-10 120C228 15 493 42 708 218C831 319 920 449 1038 487V-12H-10Z" fill="url(#shine)"/>
    <circle cx="800" cy="778" r="278" fill="#0A2540" fill-opacity="0.15"/>
  </g>
  <rect x="79" y="79" width="866" height="866" rx="193" fill="none" stroke="#FFFFFF" stroke-opacity="0.17" stroke-width="8"/>

  <g filter="url(#markShadow)">
    <g stroke="#F8FAFC" stroke-width="30" stroke-linecap="round">
      <path d="M288 405V689"/>
      <path d="M431 326V615"/>
      <path d="M574 388V684"/>
      <path d="M717 276V557"/>
    </g>
    <g fill="#F8FAFC">
      <rect x="239" y="480" width="98" height="128" rx="24"/>
      <rect x="382" y="380" width="98" height="142" rx="24"/>
      <rect x="525" y="492" width="98" height="108" rx="24"/>
      <rect x="668" y="338" width="98" height="132" rx="24"/>
    </g>

    <path d="M225 735L370 633L509 672L648 517L796 353" fill="none" stroke="url(#gold)" stroke-width="62" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M712 345L806 342L799 437" fill="none" stroke="#FFD889" stroke-width="62" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

